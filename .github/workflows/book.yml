# Publishes the guide (book/) on GitHub Pages, at https://cjus.github.io/solrac-chess/, when main
# changes it. Pages' source must be set to "GitHub Actions" once (Settings -> Pages).
# Runs only on main, never on a pull request, to spend few Actions minutes.
name: Book

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - ".github/workflows/book.yml"
  workflow_dispatch:

# One deployment at a time, and a running one is never cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - name: Build the book
        run: mdbook build book
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book/book
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
